<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <style>
    :root {
      --primary-color: #5b469b; /* Tom roxo alinhado ao cabeçalho da planilha */
      --primary-hover: #48367d;
      --bg-color: #f4f5f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: var(--primary-color);
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.6rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text-color);
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(91, 70, 155, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #a59ecc;
      cursor: not-allowed;
    }

    #feedback {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    #feedback.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }

    #feedback.error {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }
    }
    
    /* Estilos do Pop-up (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-icon {
      width: 50px;
      height: 50px;
      background-color: #28a745;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      margin: 0 auto 15px auto;
    }

    .modal-card h3 {
      color: #333;
      margin-bottom: 8px;
    }

    .modal-card p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .modal-card button {
      background-color: var(--primary-color);
      margin-top: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Cadastro de Cliente</h2>
    
    <form id="cadastroForm">
      <div class="form-group">
        <label for="cliente">Cliente (Nome Completo)</label>
        <input type="text" id="cliente" required placeholder="Ex: João Silva">
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" required placeholder="Ex: (51) 99999-9999">
      </div>

      <div class="form-group">
        <label for="data">Data de Cadastro</label>
        <input type="date" id="data" required>
      </div>

      <button type="submit" id="btnSubmit">Cadastrar na Planilha</button>
    </form>

    <div id="feedback"></div>
  </div>
  
  <!-- Modal / Pop-up de Confirmação -->
  <div id="modalSucesso" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">✓</div>
      <h3>Sucesso!</h3>
      <p>Cliente cadastrado na planilha com sucesso.</p>
      <button id="btnFecharModal" type="button">OK</button>
    </div>
  </div>

  <script>
    // Cole aqui o URL gerado na implantação do Apps Script
    const URL_DA_SUA_API = 'https://script.google.com/macros/s/AKfycbw721EK_E11-PPmDOyzBoPOppbV27MFYJlyaacVKOzxrefAQAKo_XU4NGVzMnYKDx53/exec';

    // Preenche automaticamente o campo de data com o dia de hoje
    document.getElementById('data').valueAsDate = new Date();

    const form = document.getElementById('cadastroForm');
    const feedback = document.getElementById('feedback');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Desabilita o botão para evitar envios duplicados
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Enviando...';
      feedback.className = '';
      feedback.style.display = 'none';

      // Dados para alimentar as colunas Cliente, Telefone e Data
     const dataInput = document.getElementById('data').value;
      let dataFormatada = dataInput;
      if (dataInput) {
        const [ano, mes, dia] = dataInput.split('-');
        dataFormatada = `${dia}/${mes}/${ano}`;
      }

      const payload = {
        cliente: document.getElementById('cliente').value,
        telefone: document.getElementById('telefone').value,
        data: dataFormatada
      };

      try {
        // Envio via fetch POST para o Google Apps Script
        const response = await fetch(URL_DA_SUA_API, {
          method: 'POST',
          mode: 'no-cors', // Evita restrições de CORS do Google Apps Script
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        // Exibe mensagem de sucesso
        feedback.textContent = 'Cliente cadastrado com sucesso!';
        feedback.className = 'success';

        // Reseta o formulário
        form.reset();
        document.getElementById('data').valueAsDate = new Date();

      } catch (err) {
        feedback.textContent = 'Erro ao cadastrar. Tente novamente.';
        feedback.className = 'error';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Cadastrar na Planilha';
      }
    });
    
    const modal = document.getElementById('modalSucesso');
    const btnFecharModal = document.getElementById('btnFecharModal');

    // Ao clicar no botão OK, fecha o pop-up
    btnFecharModal.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Enviando...';

      const dataInput = document.getElementById('data').value;
      let dataFormatada = dataInput;
      if (dataInput) {
        const [ano, mes, dia] = dataInput.split('-');
        dataFormatada = `${dia}/${mes}/${ano}`;
      }

      const payload = {
        cliente: document.getElementById('cliente').value,
        telefone: document.getElementById('telefone').value,
        data: dataFormatada
      };

      try {
        await fetch(URL_DA_SUA_API, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        // Limpa o formulário e restaura a data de hoje
        form.reset();
        document.getElementById('data').valueAsDate = new Date();

        // Exibe o pop-up de sucesso
        modal.classList.add('active');

      } catch (err) {
        alert('Erro ao cadastrar. Tente novamente.');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Cadastrar na Planilha';
      }
    });
  </script>

</body>
</html>
